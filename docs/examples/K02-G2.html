<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 에셋 예시 · 삼각형의 넓이</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "맑은 고딕", sans-serif; background: #eef6ff; color: #26364a; display: grid; place-items: center; }
    main { width: min(100%, 177.7778vh); aspect-ratio: 16/9; max-height: 100%; }
    .scene { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 18px 48px; }
    [hidden] { display: none !important; }
    h1 { font-size: clamp(16px, 3vw, 24px); margin: 0; }
    p { font-size: 14px; margin: 0; text-align: center; }
    .problem-content { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: clamp(12px, 4vw, 40px); width: 100%; }
    .rectangle { width: min(35%, 200px); aspect-ratio: 4/3; max-height: 100%; display: grid; place-items: center; background: #66bb6a; border: 3px solid #1565c0; clip-path: polygon(50% 0,100% 100%,0 100%); padding-top:45px; border-radius: 8px; color: #fff; font-weight: bold; }
    .answer-area { min-width: 0; display: flex; flex-direction: column; gap: 10px; max-width: 50%; }
    .answer-controls { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
    input { width: 90px; padding: 8px; border: 1px solid #90a4ae; border-radius: 8px; font-size: 14px; }
    button { padding: 8px 18px; border: 1px solid #cfd8dc; background: rgba(255,255,255,.85); color: #37474f; border-radius: 10px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #1565c0; outline-offset: 2px; }
    .navigation { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; flex-shrink: 0; }
    .navigation.first { justify-content: flex-end; }
    .solution { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .equation { font-size: clamp(20px, 4vw, 32px); color: #1565c0; font-weight: bold; }
    #feedback { min-height: 22px; color: #1565c0; }
    #completionStatus { color: #2e7d32; }
    @media (max-height: 320px) {
      .scene { padding: 8px 10px 48px; gap: 5px; }
      h1 { font-size: 17px; }
      p, .rectangle { font-size: 12px; }
      input { width: 64px; padding: 6px; }
      button { padding: 6px 12px; }
      .answer-controls { gap: 4px; }
      .answer-area, .solution { gap: 6px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="scene" id="problemScene" data-title="삼각형의 넓이" data-boy-face="how" data-boy-text="삼각형의 넓이를 구해 볼까?" data-girl-face="thinking" data-girl-text="밑변과 높이를 살펴보자!" data-problem="true" data-hint="밑변과 높이의 길이를 곱해 보세요.">
      <h1 id="problemTitle" tabindex="-1">삼각형의 넓이를 구해요</h1>
      <p>밑변 6 m, 높이 4 m인 삼각형이에요.</p>
      <div class="problem-content">
        <div class="rectangle" aria-label="밑변 6미터, 높이 4미터 삼각형">밑변 6 m · 높이 4 m</div>
        <div class="answer-area">
          <form id="answerForm">
            <div class="answer-controls">
              <label for="answer">넓이</label>
              <input id="answer" name="answer" type="number" inputmode="decimal" step="any" required autocomplete="off" aria-describedby="feedback">
              <span>m²</span>
              <button id="checkAnswerBtn" type="submit">정답 확인</button>
            </div>
          </form>
          <p id="feedback" role="status" aria-live="polite">정답을 맞히면 다음으로 갈 수 있어요.</p>
        </div>
      </div>
      <div class="navigation first">
        <button id="nextBtn" type="button" disabled>다음 ▶</button>
      </div>
    </section>
    <section class="scene" id="resultScene" data-title="풀이 확인과 미션 완료" data-boy-face="aha" data-boy-text="밑변과 높이를 곱하면 되는구나!" data-girl-face="thumb" data-girl-text="잘했어! 풀이를 확인하고 미션을 완료하자." data-problem="false" hidden>
      <h1 id="resultTitle" tabindex="-1">풀이를 확인해요</h1>
      <div class="solution">
        <p>삼각형의 넓이 = 밑변 × 높이 ÷ 2</p>
        <p class="equation">6 × 4 ÷ 2 = 12 m²</p>
        <p>준비되었다면 아래의 미션 완료를 눌러요.</p>
        <p id="completionStatus" role="status" aria-live="polite"></p>
      </div>
      <div class="navigation">
        <button id="previousBtn" type="button">◀ 이전</button>
        <button id="finishBtn" type="button">미션 완료</button>
      </div>
    </section>
  </main>
  <script>
    let solved = false;
    let completed = false;
    const answer = document.getElementById('answer');
    const nextBtn = document.getElementById('nextBtn');
    const problemScene = document.getElementById('problemScene');
    const resultScene = document.getElementById('resultScene');
    document.getElementById('answerForm').addEventListener('submit', function (event) {
      event.preventDefault();
      if (solved || completed) return;
      const value = answer.value;
      const feedback = document.getElementById('feedback');
      if (value.trim() !== '' && Number(value) === 12) {
        solved = true;
        answer.disabled = true;
        document.getElementById('checkAnswerBtn').disabled = true;
        nextBtn.disabled = false;
        feedback.textContent = '정답이에요! 다음을 눌러 풀이를 확인하세요.';
      } else {
        feedback.textContent = '밑변과 높이를 곱한 뒤 2로 나누어 보세요.';
      }
    });
    nextBtn.addEventListener('click', function () {
      if (!solved || completed) return;
      problemScene.hidden = true;
      resultScene.hidden = false;
      document.getElementById('resultTitle').focus();
    });
    document.getElementById('previousBtn').addEventListener('click', function () {
      if (completed) return;
      resultScene.hidden = true;
      problemScene.hidden = false;
      document.getElementById('problemTitle').focus();
    });
    document.getElementById('finishBtn').addEventListener('click', function () {
      if (!solved || completed || resultScene.hidden) return;
      completed = true;
      this.disabled = true;
      document.getElementById('previousBtn').disabled = true;
      document.getElementById('completionStatus').textContent = '미션을 완료했어요!';
      if (typeof window.missionClear === 'function') window.missionClear();
    });
  </script>
</body>
</html>
