<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마니산 길이 열쇠 · 게임</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Malgun Gothic,sans-serif;color:#183b39;background:#eff5e9}body{display:grid;place-items:center}main{width:min(100%,177.7778vh);min-height:100vh;padding:clamp(10px,2vw,22px);background:radial-gradient(ellipse at top right,#dcebc5,transparent 60%)}[hidden]{display:none!important}.kicker{letter-spacing:.14em;font-size:11px;color:#44785d;font-weight:bold}h1{font-size:clamp(18px,3.2vw,28px);margin:.35em 0}p{font-size:clamp(12px,2vw,16px);line-height:1.5;margin:.5em 0}.play{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,25px);align-items:center}.diagram{width:100%;max-height:220px;background:#fffdf5;border:1px solid #dce3cc;border-radius:16px}text{font:16px sans-serif;fill:#25483f}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{font:inherit;font-size:18px;width:90px;padding:8px;border:1px solid #829d89;border-radius:9px}button{font:inherit;font-size:14px;border:0;border-radius:10px;background:#28634f;color:white;padding:10px 15px;cursor:pointer}button:disabled{background:#c0cdc1;color:#536756;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #d28c22;outline-offset:3px}.feedback{min-height:43px;color:#285b48}.navigation{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.small{font-size:11px;color:#617164}.equations{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.equations article{padding:15px;background:#fffdf5;border-radius:14px}.result{font-size:clamp(20px,4vw,32px);color:#28634f;font-weight:bold}@media(max-width:440px){.play{grid-template-columns:1fr}.diagram{max-height:160px}.equations{grid-template-columns:1fr}main{width:100%}}@media(max-height:300px){main{padding:8px}h1{font-size:18px}.diagram{max-height:140px}p{font-size:12px}button{padding:6px 12px}.feedback{min-height:30px;margin:3px 0}.navigation{margin-top:3px}.small{font-size:10px}.equations{margin:8px 0}.equations article{padding:8px}}
</style></head><body><main>
<section id="challenge"><div class="kicker" id="progress">LENGTH KEY · 1 / 2</div><h1 id="heading">첫 번째 열쇠 · 비스듬한 길</h1><p id="question">직각인 두 변이 6 m, 8 m예요. 빗변 c의 길이는?</p><div class="play"><svg class="diagram" viewBox="0 0 310 210" role="img" aria-label="직각인 두 변이 6미터와 8미터인 직각삼각형"><path d="M65 35 L65 165 L260 165 Z" fill="#e2edcb" stroke="#356c52" stroke-width="3"/><path d="M65 145 L85 145 L85 165" fill="none" stroke="#356c52" stroke-width="2"/><text id="vertical" x="9" y="107">6 m</text><text id="horizontal" x="140" y="194">8 m</text><text id="diagonal" x="163" y="83">c = ?</text></svg><div><form id="answerForm"><label for="answer" id="answerLabel">빗변의 길이</label><div class="controls"><input id="answer" type="number" step="any" inputmode="decimal" required autocomplete="off" aria-describedby="feedback"><span>m</span><button id="check" type="submit">정답 확인</button></div></form><p class="feedback" id="feedback" role="status" aria-live="polite">정답을 맞히면 다음 버튼이 켜져요.</p></div></div><p class="small">학습용 가상 모형 · 그림은 실제 길이 비율과 다를 수 있어요.</p><div class="navigation"><button id="next" disabled>다음 ▶</button></div></section>
<section id="result" hidden><div class="kicker">BOTH KEYS FOUND</div><h1 tabindex="-1" id="resultTitle">두 개의 길이 열쇠를 찾았어요!</h1><p>두 문제를 모두 해결했어요. 다음 장면에서 풀이 과정을 함께 정리해요.</p><p id="completion" role="status" aria-live="polite">미션 완료를 눌러 다음 해설 장면으로 이동해요.</p><div class="navigation"><button id="finish">미션 완료</button></div></section>
</main><script>
(()=>{'use strict';let step=0,solved=false,completed=false;const $=id=>document.getElementById(id);const answers=[10,12];
$('answerForm').addEventListener('submit',e=>{e.preventDefault();if(solved||completed)return;const raw=$('answer').value.trim();if(raw!==''&&Number(raw)===answers[step]){solved=true;$('answer').disabled=true;$('check').disabled=true;$('next').disabled=false;$('feedback').textContent='정답이에요! 다음 버튼을 눌러요.';}else{$('feedback').textContent=step===0?'6² + 8² = 100이에요. 길이는 100의 양의 제곱근!':'13² − 5² = 144예요. 길이는 144의 양의 제곱근!';}});
$('next').addEventListener('click',()=>{if(!solved||completed)return;if(step===0){step=1;solved=false;$('progress').textContent='LENGTH KEY · 2 / 2';$('heading').textContent='두 번째 열쇠 · 숨은 높이';$('question').textContent='빗변이 13 m, 수평인 변이 5 m예요. 높이 b는?';$('vertical').textContent='b = ?';$('horizontal').textContent='5 m';$('diagonal').textContent='13 m';document.querySelector('svg').setAttribute('aria-label','빗변이 13미터, 수평인 변이 5미터인 직각삼각형');$('answerLabel').textContent='높이의 길이';$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('next').disabled=true;$('feedback').textContent='두 번째 문제도 정답을 맞히면 다음으로 갈 수 있어요.';$('answer').focus();}else{$('challenge').hidden=true;$('result').hidden=false;$('resultTitle').focus();}});
$('finish').addEventListener('click',()=>{if(completed||step!==1||!solved||$('result').hidden)return;completed=true;$('finish').disabled=true;$('completion').textContent='게임 완료! 이야기의 다음 장면으로 이동하세요.';if(typeof window.missionClear==='function')window.missionClear();});
})();
</script></body></html>
