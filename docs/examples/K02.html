<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>마니산 · 두 가지 넓이 탐험</title>
<style>body{font-family:Malgun Gothic,sans-serif;background:#eef6ff;color:#26364a}section{padding:20px;line-height:1.7}h1{font-size:clamp(20px,4vw,30px)}p{font-size:clamp(14px,2.5vw,19px)}</style></head>
<body>
<section class="scene" data-title="관광지 소개 · 마니산에서 넓이 찾기" data-boy-face="lookmap" data-boy-text="마니산에 도착했어! 두 가지 넓이 문제를 풀어 볼까?" data-girl-face="how" data-girl-text="게임을 하나씩 완료하며 탐험하자." data-problem="false">
  <h1>마니산에서 도형의 넓이를 찾아요</h1><p>인천 강화도의 마니산에는 참성단이 있어요. 관광지 주변에서 만날 수 있는 도형을 떠올리며 넓이를 탐구해 봐요.</p><p>첫 번째 게임은 직사각형, 두 번째 게임은 삼각형이에요. 게임의 수치는 학습을 위한 가상 값이에요.</p>
</section>
<section class="scene" data-title="직사각형의 넓이" data-game="1" data-boy-face="how" data-boy-text="가로 4, 세로 3인 직사각형의 넓이는?" data-girl-face="thinking" data-girl-text="게임 1을 끝까지 풀어 보자." data-problem="true" data-hint="직사각형의 넓이는 가로 × 세로예요."></section>
<section class="scene" data-title="삼각형의 넓이" data-game="2" data-boy-face="aha" data-boy-text="이번에는 삼각형의 넓이를 구해 보자!" data-girl-face="thinking" data-girl-text="직사각형과 어떤 차이가 있을까?" data-problem="true" data-hint="밑변과 높이를 곱한 뒤 2로 나누어요."></section>
<section class="scene" data-title="배운 수학 정리 · 탐험 돌아보기" data-boy-face="thumb" data-boy-text="두 게임을 모두 해결했어!" data-girl-face="thumb" data-girl-text="전체 미션 완료를 눌러 보석을 받자." data-problem="false">
  <h1>두 도형의 넓이를 비교해요</h1><p>직사각형의 넓이 = 가로 × 세로</p><p>삼각형의 넓이 = 밑변 × 높이 ÷ 2</p><p>확인이 끝났다면 아래의 전체 미션 완료를 눌러요.</p>
</section>
</body></html>
