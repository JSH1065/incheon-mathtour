frame.srcdoc="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\u003chead>\u003cscript>(function gameAssetBridge(channel) {\n  let completed = false;\n  let previousIndex = -1;\n  const send = (event, detail) => window.parent.postMessage(Object.assign({ type: 'MT_GAME_ASSET', channel, event }, detail || {}), '*');\n  window.missionClear = function () {\n    if (completed) return;\n    completed = true;\n    send('complete');\n  };\n  // 게임의 submit 이벤트는 실행하되 페이지 이동은 하지 않는다.\n  document.addEventListener('submit', function (event) { event.preventDefault(); });\n  window.addEventListener('error', function (event) {\n    send('error', { message: event.message || '게임에서 실행 오류가 발생했어요.' });\n  });\n  window.addEventListener('unhandledrejection', function (event) {\n    send('error', { message: String(event.reason && event.reason.message || event.reason || '게임 실행 오류') });\n  });\n  function reportScene() {\n    const list = Array.from(document.querySelectorAll('section.scene'));\n    let index = list.findIndex(function (section) {\n      const style = getComputedStyle(section);\n      return style.display !== 'none' && style.visibility !== 'hidden' && section.getClientRects().length > 0;\n    });\n    if (!list.length) index = 0;\n    if (index >= 0 && index !== previousIndex) {\n      previousIndex = index;\n      send('scene', { index });\n    }\n  }\n  function ready() {\n    reportScene();\n    new MutationObserver(reportScene).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style', 'hidden'] });\n    window.addEventListener('resize', reportScene);\n    send('ready');\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready, { once: true });\n  else ready();\n})(\"mt-mvrw00xu-ww9ycogk4z\");\u003c/script>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width\">\u003ctitle>매쓰투어 스토리보드\u003c/title>\u003cstyle>*{box-sizing:border-box}html,body{margin:0;h onst ready = i => preview || !steps[i].game || solved.has(i);\n    function paint() {\n      screens.forEach((s, i) => { s.hidden = i !== current; });\n      title.textContent = (current + 1) + ' / ' + steps.length + ' · ' + steps[current].title;\n      previous.disabled = current === 0 || done || failed;\n      next.hidden = current === steps.length - 1;\n      next.disabled = !ready(current) || done || failed;\n      finish.hidden = current !== steps.length - 1;\n      finish.disabled = !steps.every((_, i) => ready(i)) || done || failed;\n      if (!failed) status.textContent = done ? (preview ? '미리보기 확인을 마쳤어요!' : '전체 미션을 완료했어요!') : steps[current].game ? (preview ? '미리보기 · 게임 ' + steps[current].game + ' 완료 상태입니다. 다음 장면으로 이동하세요.' : ready(current) ? '게임 완료! 다음 장면으로 이동할 수 있어요.' : '게임의 마지막 미션 완료까지 진행해 주세요.') : '내용을 살펴본 뒤 다음 장면으로 이동하세요.';\n      if (!frames[current] && !(preview && steps[current].game)) {\n        const frame = document.createElement('iframe');\n        frame.title = steps[current].game ? '게임 ' + steps[current].game : steps[current].title;\n        frame.setAttribute('sandbox', steps[current].game ? 'allow-scripts allow-forms' : '');\n        screens[current].appendChild(frame);\n        frames[current] = frame;\n        frame.srcdoc = steps[current].html;\n      }\n    }\n    previous.addEventListener('click', () => { if (current > 0 && !done && !failed) { current--; paint(); } });\n    next.addEventListener('click', () => { if (current \u003c steps.length - 1 && ready(current) && !done && !failed) { current++; paint(); } });\n    finish.addEventListener('click', () => {\n      if (done || failed || current !== steps.length - 1 || !steps.every((_, i) => ready(i))) return;\n      done = true; paint();\n      if (typeof window.missionClear === 'function') window.missionClear();\n    });\n    window.addEventListener('message', event => {\n      const data = event.data;\n      const index = frames.findIndex(frame => frame && event.source === frame.content \":\"game-1-mvrw00xs-puu1502mm8\",\"html\":\"\\u003c!doctype html>\\u003chtml lang=\\\"ko\\\">\\u003chead>\\u003cmeta charset=\\\"utf-8\\\">\\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width\\\">\\u003cstyle>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Malgun Gothic,sans-serif}body{padding:14px}img{max-width:100%}*{box-sizing:border-box}html,body{margin:0;color:#173a39;font-family:Malgun Gothic,sans-serif}body{padding:0!important;background:#f3f7ef}.scene{padding:clamp(12px,3vw,26px);min-height:100vh!important;isolation:isolate;overflow:auto}.landscape{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,253,244,.96),rgba(255,253,244,.85) 60%,rgba(255,253,244,.08));z-index:-1}.copy{max-width:95%;position:relative}.tag{font-size:clamp(9px,1.6vw,12px);font-weight:bold;letter-spacing:.15em;color:#427c65}h1{margin:.35em 0 .5em;font-size:clamp(19px,3.8vw,31px);line-height:1.23}p{font-size:clamp(12px,2.2vw,17px);line-height:1.65;margin:.6em 0}.small{font-size:clamp(10px,1.7vw,12px);color:#4f6765}.formula{display:inline-block;background:#e1edda;color:#245c45;padding:9px 14px;border-radius:12px;font-weight:bold;font-size:clamp(14px,2.7vw,22px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid article{background:#fff;border:1px solid #d5e2cf;border-radius:14px;padding:10px 14px}.grid b{font-size:clamp(12px,2vw,16px)}.grid strong{color:#1b714f}@media(max-height:280px){.scene{padding:10px}h1{font-size:20px;margin:.25em 0}p{margin:.3em 0;font-size:12px}.small{font-size:10px}.formula{padding:5px 10px}}\\u003c/style>\\u003c/head>\\u003cbody>\\u003csection class=\\\"scene\\\" data-title=\\\"탐구 준비 · 산길을 삼각형으로\\\" data-boy-face=\\\"finding\\\" data-boy-text=\\\"비스듬한 길의 길이는 어떻게 구할까?\\\" data-girl-face=\\\"how\\\" data-girl-text=\\\"수평 거리와 높이를 알면 직각삼각형으로 생각할 수 있어.\\\" data-problem=\\\"false\\\" data-hint=\\\"\\\" style=\\\"min-height: 100%; display: block !important; visibility: visible !important; position: relative !important; height: auto !important;\\\">\\u003cdiv class=\\\"copy\\\">\\u003cdiv class=\\\"tag\\\">OUR QUESTION\\u003c/div>\\u003ch1>눈에 보이지 않는 길이 찾기\\u003c/h1>\\u003cp>수평 거리 \\u003cb>a\\u003c/b>, 수직 높이 \\u003cb>b\\u003c/b>, 비스듬한 길이 \\u003cb>c\\u003c/b>.\\u003cbr>두 방향이 직각이라면 \\u003cb>a² + b² = c²\\u003c/b>를 사용할 수 있어요.\\u003c/p>\\u003cdiv class=\\\"formula\\\">직각 확인 → 빗변 찾기 → 식 세우기\\u003c/div>\\u003cp class=\\\"small\\\">게임 속 길이와 산길은 학습을 위해 단순화한 가상 모형이에요.\\u003cbr>실제 등산로 거리나 참성단의 측정값이 아니에요.\\u003c/p>\\u003c/div>\\u003c/section>\\u003c/body>\\u003c/html>\"},{\"title\":\"게임 1 · 두 개의 길이 열쇠\",\"game\":1,\"channel\":\"game-2-mvrw00xs-o6f8a9h92mc\",\"html\":\"\\u003c!doctype html>\\u003chtml lang=\\\"ko\\\">\\u003chead>\\u003cscript>(function gameAssetBridge(channel) {\\n  let completed = false;\\n  let previousIndex = -1;\\n  const send = (event, detail) => window.parent.postMessage(Object.assign({ type: 'MT_GAME_ASSET', channel, event }, detail || {}), '*');\\n  window.missionClear = function () {\\n    if (completed) return;\\n    completed = true;\\n    send('complete');\\n  };\\n  // 게임의 submit 이벤트는 실행하되 페이지 이동은 하지 않는다.\\n  document.addEventListener('submit', function (event) { event.preventDefault(); });\\n  window.addEventListener('error', function (event) {\\n    send('error', { message: event.message || '게임에서 실행 오류가 발생했어요.' });\\n  });\\n  window.addEventListener('unhandledrejection', function (event) {\\n    send('error', { message: String(event.reason && event.reason.message || event.reason || '게임 실행 오류') });\\n  });\\n  function reportScene() {\\n    const list = Array.from(document.querySelectorAll('section.scene'));\\n    let index = list.findIndex(function (section) {\\n      const style = getComputedStyle(section);\\n      return style.display !== 'none' && style.visibility !== 'hidden' && section.getClientRects().length > 0;\\n    });\\n    if (!list.length) index = 0;\\n    if (index >= 0 && index !== previousIndex) {\\n      previousIndex = index;\\n      send('scene', { index });\\n    }\\n  }\\n  function ready() {\\n    reportScene();\\n    new MutationObserver(reportScene).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style', 'hidden'] });\\n    window.addEventListener('resize', reportScene);\\n    send('ready');\\n  }\\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready, { once: true });\\n  else ready();\\n})(\\\"game-2-mvrw00xs-o6f8a9h92mc\\\");\\u003c/script>\\u003cmeta charset=\\\"utf-8\\\">\\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\\u003ctitle>마니산 길이 열쇠 · 게임 1\\u003c/title>\\u003cstyle>\\n*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Malgun Gothic,sans-serif;color:#183b39;background:#eff5e9}body{display:grid;place-items:center}main{width:min(100%,177.7778vh);min-height:100vh;padding:clamp(10px,2vw,22px);background:radial-gradient(ellipse at top right,#dcebc5,transparent 60%)}[hidden]{display:none!important}.kicker{letter-spacing:.14em;font-size:11px;color:#44785d;font-weight:bold}h1{font-size:clamp(18px,3.2vw,28px);margin:.35em 0}p{font-size:clamp(12px,2vw,16px);line-height:1.5;margin:.5em 0}.play{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,25px);align-items:center}.diagram{width:100%;max-height:220px;background:#fffdf5;border:1px solid #dce3cc;border-radius:16px}text{font:16px sans-serif;fill:#25483f}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{font:inherit;font-size:18px;width:90px;padding:8px;border:1px solid #829d89;border-radius:9px}button{font:inherit;font-size:14px;border:0;border-radius:10px;background:#28634f;color:white;padding:10px 15px;cursor:pointer}button:disabled{background:#c0cdc1;color:#536756;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #d28c22;outline-offset:3px}.f off\\\" aria-describedby=\\\"feedback\\\">\\u003cspan>m\\u003c/span>\\u003cbutton id=\\\"check\\\" type=\\\"submit\\\">정답 확인\\u003c/button>\\u003c/div>\\u003c/form>\\u003cp class=\\\"feedback\\\" id=\\\"feedback\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">정답을 맞히면 다음 버튼이 켜져요.\\u003c/p>\\u003c/div>\\u003c/div>\\u003cp class=\\\"small\\\">학습용 가상 모형 · 그림은 실제 길이 비율과 다를 수 있어요.\\u003c/p>\\u003cdiv class=\\\"navigation\\\">\\u003cbutton id=\\\"next\\\" disabled=\\\"\\\">다음 ▶\\u003c/button>\\u003c/div>\\u003c/section>\\n\\u003csection id=\\\"result\\\" hidden=\\\"\\\">\\u003cdiv class=\\\"kicker\\\">BOTH KEYS FOUND\\u003c/div>\\u003ch1 tabindex=\\\"-1\\\" id=\\\"resultTitle\\\">두 개의 길이 열쇠를 찾았어요!\\u003c/h1>\\u003cdiv class=\\\"equations\\\">\\u003carticle>6² + 8² = 100\\u003cp class=\\\"result\\\">√100 = 10 m\\u003c/p>\\u003c/article>\\u003carticle>13² − 5² = 144\\u003cp class=\\\"result\\\">√144 = 12 m\\u003c/p>\\u003c/article>\\u003c/div>\\u003cp>빗변은 제곱의 합, 나머지 변은 제곱의 차를 이용해요.\\u003c/p>\\u003cp id=\\\"completion\\\" role=\\\"status\\\" aria-live=\\\"polite\\\">풀이를 확인했다면 미션 완료를 눌러요.\\u003c/p>\\u003cdiv class=\\\"navigation\\\">\\u003cbutton id=\\\"finish\\\">미션 완료\\u003c/button>\\u003c/div>\\u003c/section>\\n\\u003c/main>\\u003cscript>\\n(()=>{'use strict';let step=0,solved=false,completed=false;const $=id=>document.getElementById(id);const answers=[10,12];\\n$('answerForm').addEventListener('submit',e=>{e.preventDefault();if(solved||completed)return;const raw=$('answer').value.trim();if(raw!==''&&Number(raw)===answers[step]){solved=true;$('answer').disabled=true;$('check').disabled=true;$('next').disabled=false;$('feedback').textContent='정답이에요! 다음 버튼을 눌러요.';}else{$('feedback').textContent=step===0?'6² + 8² = 100이에요. 길이는 100의 양의 제곱근!':'13² − 5² = 144예요. 길이는 144의 양의 제곱근!';}});\\n$('next').addEventListener('click',()=>{if(!solved||completed)return;if(step===0){step=1;solved=false;$('progress').textContent='LENGTH KEY · 2 / 2';$('heading').textContent='두 번째 열쇠 · 숨은 높이';$('
